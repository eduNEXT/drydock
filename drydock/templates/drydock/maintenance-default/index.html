<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>We'll be right back</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
        }
        .card {
            max-width: 32rem;
            text-align: center;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.75rem; margin: 0 0 1rem; }
        p { margin: 0 0 0.75rem; color: #94a3b8; }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Scheduled maintenance</span>
        <h1>We&rsquo;ll be right back</h1>
        <p>The platform is temporarily unavailable while we perform scheduled maintenance.</p>
        <p>Thank you for your patience &mdash; please check back again shortly.</p>
    </main>
</body>
</html>
